<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel CRM | EVI Imóveis</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f3b2d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611141541">
  <link rel="stylesheet" href="crm/crm.css?v=202611141541">
</head>
<body>

  <header class="topo">
    <div class="container topo__conteudo">
      <span class="logo">EVI <span>CRM</span></span>
      <nav class="menu crm-menu-topo oculto" id="menu-app">
        <button type="button" class="crm-link" data-acao="copiar-link">Copiar link</button>
        <button type="button" class="crm-link" data-acao="sair">Sair</button>
      </nav>
    </div>
  </header>

  <!-- CRM não configurado -->
  <main id="v-config" class="container crm-publico oculto">
    <section class="crm-ok">
      <h1>CRM ainda não configurado</h1>
      <p class="crm-sub">Preencha <code>crm/config.js</code> com os dados do Supabase. O passo a passo está no arquivo <code>README.md</code>.</p>
    </section>
  </main>

  <!-- LOGIN -->
  <main id="v-login" class="container crm-publico oculto">
    <section class="crm-login">
      <h1>Entrar no painel</h1>
      <p class="crm-sub">Acesso restrito à equipe.</p>
      <form id="form-login" class="crm-form">
        <label class="crm-campo">E-mail<input type="email" name="email" autocomplete="username" required></label>
        <label class="crm-campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <p class="crm-erro oculto" id="erro-login" role="alert"></p>
        <button type="submit" class="botao botao--zap">Entrar</button>
      </form>
    </section>
  </main>

  <!-- PAINEL -->
  <div id="v-app" class="crm-layout oculto">
    <aside class="crm-lateral" id="lateral">
      <nav class="crm-abas" aria-label="Seções do painel">
        <button class="crm-aba" data-aba="tarefas" title="Tarefas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span class="crm-aba__nome">Tarefas</span><span class="crm-aba__n" id="n-tarefas"></span></button>
        <button class="crm-aba" data-aba="leads" title="Leads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg><span class="crm-aba__nome">Leads</span><span class="crm-aba__n" id="n-leads"></span></button>
        <button class="crm-aba" data-aba="corretores" title="Corretores"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.5 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3.3 0-7 1.6-7 4.5V20h14v-2.5c0-2.9-3.7-4.5-7-4.5zm7.5 0c-.5 0-1 0-1.5.1 1.5 1 2.5 2.5 2.5 4.4V20H22v-2.5c0-2.7-3-4.5-5.5-4.5z"/></svg><span class="crm-aba__nome">Corretores</span><span class="crm-aba__n" id="n-corretores"></span></button>
        <button class="crm-aba" data-aba="envios" title="Envios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg><span class="crm-aba__nome">Envios</span><span class="crm-aba__n" id="n-envios"></span></button>
        <button class="crm-aba" data-aba="imobiliarias" title="Imobiliárias"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-3 8 3v16h-6v-5h-4v5zm4-13v2h2V8zm6 0v2h2V8zm-6 4v2h2v-2zm6 0v2h2v-2z"/></svg><span class="crm-aba__nome">Imobiliárias</span><span class="crm-aba__n" id="n-imobiliarias"></span></button>
        <button class="crm-aba" data-aba="anuncios" title="Anúncios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H5.2L4 17.2zm2 2v7h12V6zm2 2h8v2H8zm0 3h5v2H8zM4 19h16v2H4z"/></svg><span class="crm-aba__nome">Anúncios</span><span class="crm-aba__n" id="n-anuncios"></span></button>
        <button class="crm-aba" data-aba="relatorios" title="Relatórios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16v2H4zM5 11h3v7H5zm5.5-7h3v14h-3zM16 8h3v10h-3z"/></svg><span class="crm-aba__nome">Relatórios</span></button>
        <button class="crm-aba" data-aba="digo" title="Pagamentos Digo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zm2 2v8h14V8zm7 1.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM6 9.5h2v2H6zm10 3h2v2h-2z"/></svg><span class="crm-aba__nome">Pagamentos Digo</span><span class="crm-aba__n" id="n-digo"></span></button>
      </nav>
      <div class="crm-lateral__rodape">
        <button type="button" class="crm-aba crm-aba--acao" data-acao="copiar-link" title="Copiar link de cadastro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3.5-3.5a4 4 0 0 0-5.7-5.7l-1.2 1.2 1.4 1.4 1.2-1.2a2 2 0 0 1 2.9 2.9L14.3 12.6a2 2 0 0 1-2.9 0zM14 10a4 4 0 0 0-5.7 0l-3.5 3.5a4 4 0 0 0 5.7 5.7l1.2-1.2-1.4-1.4-1.2 1.2a2 2 0 0 1-2.9-2.9l3.5-3.5a2 2 0 0 1 2.9 0z"/></svg><span class="crm-aba__nome">Copiar link de cadastro</span></button>
        <button type="button" class="crm-aba crm-aba--acao" data-acao="sair" title="Sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5v-2H6V6h4zm5.6 3.6-1.4 1.4 2 2H9v2h7.2l-2 2 1.4 1.4L20 12z"/></svg><span class="crm-aba__nome">Sair</span></button>
        <button type="button" class="crm-aba crm-aba--acao crm-recolher" data-acao="recolher" title="Recolher ou abrir o menu" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3 13.3 4.9 6.2 12l7.1 7.1 1.4-1.4L9 12z"/></svg><span class="crm-aba__nome">Recolher menu</span></button>
      </div>
    </aside>
    <main class="crm-app">
      <div id="conteudo"></div>
    </main>
  </div>

  <div id="menu-linha" class="crm-menu-linha" role="menu" hidden></div>

  <dialog id="janela" class="crm-janela">
    <button class="crm-janela__fechar" aria-label="Fechar" data-acao="fechar">×</button>
    <div id="janela-conteudo"></div>
  </dialog>

  <div id="aviso" class="crm-toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="crm/config.js?v=202611141541"></script>
  <script src="crm/comum.js?v=202611141541"></script>
  <script src="crm/digo.js?v=202611141541"></script>
  <script src="crm/imobiliarias.js?v=202611141541"></script>
  <script src="crm/extrair.js?v=202611141541"></script>
  <script src="crm/anuncios.js?v=202611141541"></script>
  <script src="crm/tarefas.js?v=202611141541"></script>
  <script src="crm/painel.js?v=202611141541"></script>
</body>
</html>
